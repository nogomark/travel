<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>제주 4일 일정</title>
<style>
:root {
  --bg: #eef2f0; --surface: #ffffff; --fg: #1c2a2d; --muted: #5d6f72;
  --accent: #1d6b74; --warn: #9a5b13; --line: #d3dcda;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #121a1c; --surface: #1a2528; --fg: #e4ecea; --muted: #9bb0ae; --accent: #6fc2cc; --warn: #e0a25a; --line: #2c3b3e; color-scheme: dark; }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.6 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 680px; margin: 0 auto; display: grid; gap: 16px; }
h1 { margin: 0; font-size: 22px; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tabs button {
  font: inherit; font-size: 14px; padding: 8px 12px; min-height: 40px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--fg); cursor: pointer;
}
.tabs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }
.day h2 { margin: 0; font-size: 16px; }
.day .sub { margin: 2px 0 8px; }
ol.stops { list-style: none; margin: 0; padding: 0; }
li.stop { display: grid; grid-template-columns: 24px 46px 1fr; gap: 8px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); }
li.stop:first-child { border-top: 0; }
li.stop input { width: 22px; height: 22px; margin-top: 3px; accent-color: var(--accent); }
li.stop label { cursor: pointer; min-width: 0; -webkit-tap-highlight-color: transparent; }
.time { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 600; font-size: 14px; }
.name { font-weight: 600; overflow-wrap: anywhere; }
.note { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.check { color: var(--warn); font-size: 13px; }
li.stop.done .name, li.stop.done .note { text-decoration: line-through; opacity: .55; }
.foot { color: var(--muted); font-size: 13px; margin: 0; }
@media (max-width: 480px) {
  .day { padding: 12px; }
  li.stop { grid-template-columns: 22px 44px 1fr; gap: 6px; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>제주 4일 일정</h1>
    <p class="sub">11월 21일(토) – 24일(화) · 렌터카</p>
  </header>

  <div class="tabs" role="group" aria-label="날짜별 보기">
    <button type="button" data-day="all" aria-pressed="true">전체</button>
    <button type="button" data-day="0" aria-pressed="false">21일</button>
    <button type="button" data-day="1" aria-pressed="false">22일</button>
    <button type="button" data-day="2" aria-pressed="false">23일</button>
    <button type="button" data-day="3" aria-pressed="false">24일</button>
  </div>

  <div id="days"></div>

  <p class="foot">운영 시간과 휴무는 방문 전에 확인하세요. 체크 표시는 이 브라우저에만 저장됩니다.</p>
</main>

<script>
const days = [
  { title: "제주공항 도착 · 제주시 1박", sub: "해호텔 제주 1박", stops: [
    { time: "14:30", name: "제주국제공항", note: "도착, 렌터카 수령" },
    { time: "15:30", name: "해호텔 제주 체크인", note: "체크인 14:00 이후, 짐 두고 출발", check: "체크인 시간 확인" },
    { time: "16:30", name: "책방 소리소문", note: "한림읍. 토요일 11–18시", check: "운영 확인" },
    { time: "17:30", name: "도두 무지개해안도로", note: "일몰 감상" },
    { time: "18:30", name: "탑동 해안과 동문재래시장", note: "저녁 산책" }
  ]},
  { title: "서쪽 미술관과 박물관", sub: "서귀포JS호텔 1박", stops: [
    { time: "09:30", name: "해호텔 제주 체크아웃", note: "짐 챙겨 출발", check: "체크아웃 시간 확인" },
    { time: "10:00", name: "김창열미술관", note: "한림읍, 물방울 작품과 실감 체험관", check: "월요일 휴무" },
    { time: "13:00", name: "본태박물관", note: "안덕면, 안도 다다오 건축, 쿠사마 야요이 작품" },
    { time: "15:30", name: "포도뮤지엄", note: "안덕면, 야외 조각공원" },
    { time: "17:00", name: "서귀포JS호텔 체크인", note: "체크인 시간 확인 후 이동", check: "체크인 시간 확인" },
    { time: "18:30", name: "서귀포 올레시장", note: "저녁 간식과 먹거리 구경", check: "운영 시간 확인" }
  ]},
  { title: "야외 위주", sub: "서귀포JS호텔 2박 · 박물관과 미술관은 월요일 휴무", stops: [
    { time: "10:00", name: "중문 대포 주상절리대", note: "오전 방문이 덜 붐빔" },
    { time: "13:00", name: "중문·색달 해변", note: "바람 쐬기" },
    { time: "15:00", name: "천지연폭포", note: "짧게 들르기" },
    { time: "17:00", name: "이중섭거리", note: "저녁 산책" }
  ]},
  { title: "출발", sub: "오후 6시 비행기", stops: [
    { time: "11:00", name: "서귀포JS호텔 체크아웃", note: "짐 맡기고 다음 일정", check: "체크아웃 시간 확인" },
    { time: "11:30", name: "이중섭미술관", note: "짐 맡긴 뒤 관람", check: "운영 확인" },
    { time: "15:00", name: "서귀포 출발", note: "공항까지 1시간 이상 걸릴 수 있음" },
    { time: "16:30", name: "제주국제공항 도착, 렌터카 반납", note: "출발 1시간 30분 전 도착 기준" }
  ]}
];

const KEY = "jeju-public-done";
let done = {};
try { done = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { done = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} }

const root = document.getElementById("days");
const labels = ["21일 (토)", "22일 (일)", "23일 (월)", "24일 (화)"];

days.forEach(function (d, di) {
  const sec = document.createElement("section");
  sec.className = "day";
  sec.dataset.day = String(di);
  const h = document.createElement("h2");
  h.textContent = labels[di] + " · " + d.title;
  const sub = document.createElement("p");
  sub.className = "sub";
  sub.textContent = d.sub;
  const ol = document.createElement("ol");
  ol.className = "stops";

  d.stops.forEach(function (s, i) {
    const id = di + "-" + i;
    const li = document.createElement("li");
    li.className = "stop" + (done[id] ? " done" : "");
    const box = document.createElement("input");
    box.type = "checkbox";
    box.id = "s-" + id;
    box.checked = !!done[id];
    box.addEventListener("change", function () {
      done[id] = box.checked;
      li.classList.toggle("done", box.checked);
      save();
    });
    const time = document.createElement("span");
    time.className = "time";
    time.textContent = s.time;
    const body = document.createElement("label");
    body.htmlFor = box.id;
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = s.name;
    body.appendChild(name);
    if (s.note) {
      const note = document.createElement("div");
      note.className = "note";
      note.textContent = s.note;
      body.appendChild(note);
    }
    if (s.check) {
      const c = document.createElement("div");
      c.className = "check";
      c.textContent = s.check;
      body.appendChild(c);
    }
    li.append(box, time, body);
    ol.appendChild(li);
  });

  sec.append(h, sub, ol);
  root.appendChild(sec);
});

function showDay(which) {
  document.querySelectorAll(".day").forEach(function (sec) {
    sec.hidden = which !== "all" && sec.dataset.day !== which;
  });
  document.querySelectorAll(".tabs button").forEach(function (b) {
    b.setAttribute("aria-pressed", String(b.dataset.day === which));
  });
}
document.querySelectorAll(".tabs button").forEach(function (b) {
  b.addEventListener("click", function () { showDay(b.dataset.day); });
});
</script>
</body>
</html>
